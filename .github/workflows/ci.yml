name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    # Structural checks always run. With n8n-nodes-base installed, the
    # validator also confirms every node type exists and every typeVersion is
    # one that n8n release implements, which is what breaks on import.
    name: Validate against n8n ${{ matrix.n8n.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        n8n:
          # The packages bundled with n8n 2.22.6, the release the workflows
          # were import-tested on.
          - label: "2.22.6 (import-tested)"
            nodes-base: "2.22.3"
            core: "2.22.4"
          # Whatever n8n currently ships, so drift shows up before a user
          # hits it on import.
          - label: "stable"
            nodes-base: "stable"
            core: "stable"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install n8n node registry
        run: npm install --no-save --no-audit --no-fund n8n-nodes-base@${{ matrix.n8n.nodes-base }} n8n-core@${{ matrix.n8n.core }}

      - name: Validate workflows
        # The validator falls back to structural checks when it cannot load
        # the node registry. That is right locally but would let a broken
        # install pass here, so require the deep check to have run.
        shell: bash
        run: |
          node scripts/validate-workflows.mjs | tee validate.log
          grep -q "Node registry loaded" validate.log
